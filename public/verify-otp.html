<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwapPay | Verify Email</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .auth-card h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .auth-card h2 span {
            color: var(--accent-secondary);
        }

        .auth-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 10px;
            text-align: center;
            transition: border-color 0.3s, background 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-secondary);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent-primary), #8e7dfa);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(108, 92, 231, 0.4);
        }

        .btn-submit:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .auth-links {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            color: var(--text-secondary);
        }

        .auth-links button {
            background: none;
            border: none;
            color: var(--accent-secondary);
            text-decoration: none;
            font-weight: 600;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
        }

        .auth-links button:disabled {
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .auth-links button:hover:not(:disabled) {
            text-decoration: underline;
        }
        
        .message-box {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 600;
        }

        .message-success {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            border: 1px solid #2ecc71;
            display: block;
        }

        .message-error {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid #e74c3c;
            display: block;
        }
    </style>

    <script src="/js/api.js"></script>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="navbar">
        <div class="logo"><a href="/" style="text-decoration: none; color: inherit;">Swap<span>Pay</span></a></div>
        <ul class="nav-links">
            <li><a href="/login">Login Instead</a></li>
            <li><a href="/register">Register</a></li>
        </ul>
        <div class="hamburger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Verify <span>Email</span></h2>
            <p>An OTP has been sent to your email. It expires in 5 minutes.</p>

            <div id="messageBox" class="message-box"></div>

            <form id="verifyForm">
                <input type="hidden" id="emailVal">
                <div class="form-group">
                    <input type="text" id="otp" class="form-control" placeholder="••••••" maxlength="6" required autocomplete="off">
                </div>
                <button type="submit" id="btnVerify" class="btn-submit">Verify Account</button>
            </form>
            
            <div class="auth-links">
                <button type="button" id="btnResend" onclick="resendOTP()">Resend OTP (<span id="countdown">30</span>s)</button>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email');
        
        document.getElementById('emailVal').value = userEmail;

        if (!userEmail) {
            showMessage("Invalid Session. Please register again.", "error");
            document.getElementById('btnVerify').disabled = true;
            document.getElementById('btnResend').disabled = true;
        }

        // Timer Logic
        let cd = 30;
        let timerFunc = null;

        function startTimer() {
            cd = 30;
            const btn = document.getElementById('btnResend');
            const counter = document.getElementById('countdown');
            btn.disabled = true;
            
            clearInterval(timerFunc);
            timerFunc = setInterval(() => {
                cd--;
                counter.innerText = cd;
                if (cd <= 0) {
                    clearInterval(timerFunc);
                    counter.innerText = "0";
                    btn.disabled = false;
                    btn.innerHTML = "Resend OTP";
                }
            }, 1000);
        }
        
        // Start timer automatically on page load
        if (userEmail) startTimer();

        function showMessage(msg, type) {
            const box = document.getElementById('messageBox');
            box.innerText = msg;
            box.className = 'message-box message-' + type;
        }

        document.getElementById('verifyForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const otpCode = document.getElementById('otp').value;
            const btn = document.getElementById('btnVerify');
            
            btn.disabled = true;
            btn.innerText = "Verifying...";
            
            try {
                const res = await apiFetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, otp: otpCode })
                });

                const data = await res.json();
                
                if (data.success) {
                    showMessage("Email verified successfully! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showMessage(data.message || "Invalid or expired OTP", "error");
                }
            } catch (err) {
                showMessage("A connection error occurred.", "error");
            } finally {
                if(btn.innerText !== 'Verifying... (Success)') {
                    btn.disabled = false;
                    btn.innerText = "Verify Account";
                }
            }
        });

        async function resendOTP() {
            const btn = document.getElementById('btnResend');
            btn.disabled = true;
            btn.innerText = "Sending...";
            
            try {
                const res = await apiFetch('/api/auth/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });

                const data = await res.json();
                
                if (data.success) {
                    showMessage("A new OTP has been sent to your email.", "success");
                    btn.innerHTML = 'Resend OTP (<span id="countdown">30</span>s)';
                    startTimer();
                } else {
                    showMessage(data.message || "Failed to resend OTP.", "error");
                    btn.disabled = false;
                    btn.innerHTML = "Resend OTP";
                }
            } catch (err) {
                showMessage("A connection error occurred.", "error");
                btn.disabled = false;
                btn.innerHTML = "Resend OTP";
            }
        }
    </script>
</body>

</html>
