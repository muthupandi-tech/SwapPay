<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwapPay | Security & Privacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/guide.css">
    <style>
        .profile-container {
            padding: 3rem 5%;
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .profile-header h1 { font-size: 2.5rem; }
        .profile-header h1 span { color: var(--accent-secondary); }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s, background 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-secondary);
            background: rgba(255, 255, 255, 0.1);
        }



        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .safety-tip {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>

    <script src="/js/api.js"></script>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="navbar">
        <div class="logo">Swap<span>Pay</span></div>
        <div class="navbar-right">
            <!-- Guide Icon -->
            <div class="guide-nav-icon" id="guideIcon">
                📘<span class="guide-tooltip">Guide</span>
            </div>

            <!-- Notification Bell -->
            <div class="notification-container" id="notificationIcon" onclick="toggleNotifications(event)">
                <div class="bell-icon" id="notification-bell">🔔</div>
                <div class="notification-badge" id="notifBadge">0</div>

                <div class="notification-dropdown" id="notifDropdown" onclick="event.stopPropagation()">
                    <div class="dropdown-header">Notifications</div>
                    <div id="notifList">
                        <!-- Notifications will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Avatar Dropdown -->
            <div class="user-profile-container" onclick="toggleProfileDropdown(event)">
                <div class="profile-avatar">👤</div>
                <div class="profile-dropdown" id="profileDropdown" onclick="event.stopPropagation()">
                    <a href="/profile" class="profile-dropdown-item">View Profile</a>
                    <a href="/settings" class="profile-dropdown-item">Settings</a>
                    <a href="/api/auth/logout" class="profile-dropdown-item text-danger">Logout</a>
                </div>
            </div>

            <div class="hamburger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>
    </nav>

    <main class="profile-container">
        <div class="profile-header">
            <h1>Security <span>& Privacy</span></h1>
        </div>

        <div id="alert" class="alert"></div>

        <div class="card">
            <h2>Change Password</h2>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label for="oldPassword">Old Password</label>
                    <div class="password-group">
                        <input type="password" id="oldPassword" name="oldPassword" class="form-control" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('oldPassword', this)" title="Toggle Password Visibility">
                            👁️
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-group">
                        <input type="password" id="newPassword" name="newPassword" class="form-control" required onkeyup="updatePasswordStrength(this.value, 'strengthIndicator')">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('newPassword', this)" title="Toggle Password Visibility">
                            👁️
                        </button>
                    </div>
                    <div id="strengthIndicator" class="password-strength"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('confirmPassword', this)" title="Toggle Password Visibility">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-premium"><span>💾</span> Update Password</button>
            </form>

            <div class="safety-tip">
                <span>🛡️</span>
                <span>Never share your password with anyone. We will never ask for it.</span>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script>
        const form = document.getElementById('changePasswordForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'New passwords do not match.';
                alertBox.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'New password must be at least 6 characters.';
                alertBox.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Updating...';
            alertBox.style.display = 'none';

            try {
                const response = await apiFetch('/api/user/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = data.message;
                    alertBox.style.display = 'block';
                    form.reset();
                    document.getElementById('strengthIndicator').innerText = '';
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerText = data.error || 'Error updating password.';
                    alertBox.style.display = 'block';
                }
            } catch (error) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'Network error. Please try again later.';
                alertBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Update Password';
            }
        });
    </script>
    <script src="/js/guide.js"></script>
</body>

</html>
