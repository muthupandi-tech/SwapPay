<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwapPay | Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .auth-card h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .auth-card h2 span {
            color: var(--accent-secondary);
        }

        .auth-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s, background 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-secondary);
            background: rgba(255, 255, 255, 0.1);
        }


        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: none;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .safety-info {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
            padding: 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>

    <script src="/js/api.js"></script>
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="navbar">
        <div class="logo"><a href="/" style="text-decoration: none; color: inherit;">Swap<span>Pay</span></a></div>
        <ul class="nav-links">
            <li><a href="/login">Login</a></li>
            <li><a href="/register">Register</a></li>
        </ul>
        <div class="hamburger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h2>New <span>Password</span></h2>
            <p>Please enter your new password below.</p>

            <div class="safety-info">
                <span>🛡️</span>
                <span>Never share your password with anyone.</span>
            </div>

            <div id="alert" class="alert"></div>

            <form id="resetForm">
                <input type="hidden" id="token" name="token">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="password-group">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Min 6 characters" required onkeyup="updatePasswordStrength(this.value, 'strengthIndicator')">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)" title="Toggle Password Visibility">
                            👁️
                        </button>
                    </div>
                    <div id="strengthIndicator" class="password-strength"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat your new password" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('confirmPassword', this)" title="Toggle Password Visibility">
                            👁️
                        </button>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit">Reset Password</button>
            </form>
        </div>
    </main>

    <script src="/js/main.js"></script>
    <script>
        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        document.getElementById('token').value = token;

        const resetForm = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alert');

        if (!token) {
            alertBox.className = 'alert alert-error';
            alertBox.innerText = 'Invalid reset link. No token found.';
            alertBox.style.display = 'block';
            submitBtn.disabled = true;
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'Passwords do not match.';
                alertBox.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'Password must be at least 6 characters.';
                alertBox.style.display = 'block';
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Resetting...';
            alertBox.style.display = 'none';

            try {
                const response = await apiFetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = data.message;
                    alertBox.style.display = 'block';
                    resetForm.reset();
                    document.getElementById('strengthIndicator').innerText = '';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerText = data.message || 'Error resetsing password.';
                    alertBox.style.display = 'block';
                }
            } catch (error) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'Network error. Please try again later.';
                alertBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Reset Password';
            }
        });
    </script>
</body>

</html>
